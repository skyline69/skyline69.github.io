name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # Same Node as the build job (withastro/action@v6 defaults to 24).
          node-version: 24
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Type check, lint, format, test, build
        run: bun run verify

  build:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      # Chrome origin trial token for HTML-in-Canvas. Set it as a repository variable;
      # when empty, the site ships without it and every effect uses its fallback.
      ORIGIN_TRIAL_TOKEN: ${{ vars.ORIGIN_TRIAL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install, build, and upload
        uses: withastro/action@v6
        with:
          package-manager: bun@latest

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
